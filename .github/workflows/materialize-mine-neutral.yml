name: Materialize HOC Mine Neutral Runtime

on:
  push:
    branches:
      - agent/hoc-mine-neutral-candidate
    paths:
      - 'candidates/hoc/mine-neutral/.materialize/runtime512/**'
      - '.github/workflows/materialize-mine-neutral.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check canonical transport pieces
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          root='candidates/hoc/mine-neutral/.materialize/runtime512'
          required=(
            part-00.b64 part-01.b64 part-02.b64 part-03.b64 part-04.b64
            part-05a.b64 part-05b.b64 part-06.b64 part-07.b64
          )
          for name in "${required[@]}"; do
            test -f "$root/$name" || {
              echo "Missing transport piece: $name" >&2
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            }
          done
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize exact Mine runtime
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root='candidates/hoc/mine-neutral'
          transport="$root/.materialize/runtime512"
          mkdir -p "$root/art"

          # part-00 lost exactly 20 base64 characters at byte offset 500 during
          # connector transport. Restore the canonical sequence at that exact
          # position; all bytes after it remain aligned with the master.
          {
            head -c 500 "$transport/part-00.b64"
            printf '%s' '+Zmf+Zmf+Zmf+Zmf+Zmf'
            tail -c +501 "$transport/part-00.b64"
            cat "$transport/part-01.b64" "$transport/part-02.b64" "$transport/part-03.b64" "$transport/part-04.b64"
            cat "$transport/part-05a.b64" "$transport/part-05b.b64"
            cat "$transport/part-06.b64" "$transport/part-07.b64"
          } | base64 -d > "$root/art/LANDMARK_MINE_NEUTRAL_01.png"

          file="$root/art/LANDMARK_MINE_NEUTRAL_01.png"
          test "$(stat -c%s "$file")" = '48099'
          echo '4398f8d96c1bfb50d89a34717f4ce18a5ad69140864dec99eb814d7e3d9b00c4  candidates/hoc/mine-neutral/art/LANDMARK_MINE_NEUTRAL_01.png' | sha256sum -c -

          python - <<'PY'
          from pathlib import Path
          p=Path('candidates/hoc/mine-neutral/art/LANDMARK_MINE_NEUTRAL_01.png')
          b=p.read_bytes()
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          assert int.from_bytes(b[16:20], 'big') == 512
          assert int.from_bytes(b[20:24], 'big') == 512
          print('MINE_RUNTIME_OK', p.stat().st_size)
          PY

          python -m pip install -e .
          python -m tehkne_assets_forge.cli validate-hoc-landmark-candidate "$root/pack-manifest.json" --root "$root"

      - name: Commit clean materialized candidate
        if: steps.ready.outputs.ready == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf candidates/hoc/mine-neutral/.materialize
          rm -f .github/workflows/materialize-mine-neutral.yml
          git config user.name 'tehkne-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(hoc): materialize Mine Candidate A runtime'
          git push
