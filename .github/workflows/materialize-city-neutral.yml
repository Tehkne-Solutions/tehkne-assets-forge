name: Materialize HOC City Neutral Candidate

on:
  push:
    branches:
      - agent/hoc-city-neutral-candidate
    paths:
      - 'candidates/hoc/city-neutral/.materialize/final-runtime/**'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for complete transport
        id: ready
        shell: bash
        run: |
          shopt -s nullglob
          parts=(candidates/hoc/city-neutral/.materialize/final-runtime/part-*.b64)
          if [ "${#parts[@]}" -ne 15 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Waiting: ${#parts[@]}/15 parts present"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Materialize exact runtime PNG
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidates/hoc/city-neutral/art
          cat candidates/hoc/city-neutral/.materialize/final-runtime/part-*.b64 | base64 -d > candidates/hoc/city-neutral/art/LANDMARK_CITY_NEUTRAL_01.png
          echo 'e41278eb534bc33a9a7af19daef9d0987ea31712d30351a708b32e45526f14aa  candidates/hoc/city-neutral/art/LANDMARK_CITY_NEUTRAL_01.png' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p = Path('candidates/hoc/city-neutral/art/LANDMARK_CITY_NEUTRAL_01.png')
          im = Image.open(p)
          assert im.size == (2048, 2048), im.size
          assert im.format == 'PNG', im.format
          print('CITY_RUNTIME_MATERIALIZED', im.mode, im.size, p.stat().st_size)
          PY
          python -m tehkne_assets_forge.cli validate-hoc-landmark-candidate candidates/hoc/city-neutral/pack-manifest.json --root candidates/hoc/city-neutral
      - name: Commit clean binary tree
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf candidates/hoc/city-neutral/.materialize
          rm -f .github/workflows/materialize-city-neutral.yml
          git config user.name 'tehkne-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(hoc): materialize neutral City runtime asset'
          git push
